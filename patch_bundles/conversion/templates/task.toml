version = "1.0"

[task]
name = "nwrc/@@NAME@@"
description = "Repair the vulnerability behind @@CVE_UPPER@@ in the running application without breaking its functionality. Graded in the same sandbox by the task's original functional and vulnerability test suites (Harbor patch task, single image)."
keywords = [@@KEYWORDS@@]

[metadata]
cve_id = "@@CVE_UPPER@@"
type = "patch"
mode = "single-image"
difficulty = "@@DIFFICULTY@@"
category = "@@CATEGORY@@"
tags = [@@TAGS@@]
source = "cve_tasks20261016/cve-verified-1497/@@CVE@@"
version_tag = "@@VER@@"
@@EXTRA_METADATA@@

[verifier]
timeout_sec = @@VERIFIER_TIMEOUT@@

[agent]
timeout_sec = @@AGENT_TIMEOUT@@

[environment]
# 单镜像：agent 在此镜像内修复代码，判定（tests/test.sh）也在同一沙箱内执行。
# 本地自测用 :VER 本地标签；push.sh 推送到 SWR 后回填为远端地址。
docker_image = "@@IMG_TAG@@"
build_timeout_sec = 3000.0
cpus = @@CPUS@@
memory_mb = @@MEMORY_MB@@
